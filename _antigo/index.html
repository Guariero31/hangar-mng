<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · {site}</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="center-screen">
    <section class="card auth-card">
      <div class="eyebrow"><span class="brand-mark"></span><span class="label" data-site-name></span></div>
      <h1>Acesso de pilotos</h1>
      <p class="lead">Entre com sua conta Google para ver sua pontuação e liberar novas aeronaves.</p>

      <div id="error" class="alert hidden"></div>

      <button id="google" class="btn btn-google block">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Entrar com Google
      </button>

      <div class="foot">No primeiro acesso você vai escolher o nickname usado no servidor.</div>
    </section>
  </main>

  <script type="module">
    import { supabase } from './js/supabase.js';
    import { getProfile, routeFor, go, loginWithGoogle } from './js/auth.js';
    import { applySiteName, $ } from './js/ui.js';

    applySiteName();
    const showError = (msg) => { const el = $('#error'); el.textContent = msg; el.classList.remove('hidden'); };

    if (new URLSearchParams(location.search).has('banned')) {
      showError('Sua conta está suspensa. Fale com um administrador.');
    }

    $('#google').addEventListener('click', async () => {
      $('#google').disabled = true;
      const { error } = await loginWithGoogle();
      if (error) { showError('Não foi possível iniciar o login com Google.'); $('#google').disabled = false; }
    });

    // Já logado (ou voltando do Google)? Manda para o lugar certo.
    async function check() {
      try {
        const profile = await getProfile();
        if (!profile) return;
        if (profile.status === 'banned') {
          await supabase.auth.signOut();
          return showError('Sua conta está suspensa. Fale com um administrador.');
        }
        go(routeFor(profile));
      } catch (e) {
        console.error(e);
        showError('Não foi possível carregar seu perfil. Tente novamente.');
      }
    }
    check();
    supabase.auth.onAuthStateChange((event) => { if (event === 'SIGNED_IN') check(); });
  </script>
</body>
</html>
