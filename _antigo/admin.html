<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel admin · {site}</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar" class="topbar"></header>

  <main class="page">
    <div class="page-head">
      <div>
        <span class="label">Administração</span>
        <h1>Jogadores</h1>
        <p>Clique em um jogador para lançar pontos, gerenciar aeronaves ou suspender a conta.</p>
      </div>
      <button id="export" class="btn ghost">Exportar CSV</button>
    </div>

    <div class="admin-grid">
      <section class="card">
        <div class="toolbar">
          <input id="search" class="input" type="search" placeholder="Buscar por nickname ou e-mail">
          <select id="sort" class="input" aria-label="Ordenar por">
            <option value="earned">Ranking (pontos ganhos)</option>
            <option value="balance">Saldo atual</option>
            <option value="aircraft">Aeronaves</option>
            <option value="created">Cadastro mais recente</option>
            <option value="nickname">Nickname (A–Z)</option>
          </select>
          <span id="count" class="label count"></span>
        </div>
        <div class="table-wrap">
          <table class="players">
            <thead>
              <tr>
                <th>#</th><th>Nickname</th><th>E-mail</th>
                <th class="num">Ganhos</th><th class="num">Saldo</th><th class="num">Aeronaves</th>
                <th>DCS</th><th>Status</th><th>Cadastro</th>
              </tr>
            </thead>
            <tbody id="rows"><tr><td colspan="9" class="loading">CARREGANDO…</td></tr></tbody>
          </table>
        </div>
      </section>

      <aside id="detail" class="card detail">
        <div class="empty">Selecione um jogador na lista.</div>
      </aside>
    </div>
  </main>

  <script type="module">
    import { requireProfile } from './js/auth.js';
    import { admin } from './js/api.js';
    import { renderTopbar, refreshBalance, toast, esc, fmtPoints, fmtDate, $ } from './js/ui.js';

    const me = await requireProfile({ admin: true });
    let players = [];
    let selectedId = null;

    // ---------------- Lista ----------------
    async function loadPlayers() {
      try {
        players = await admin.listPlayers($('#search').value.trim(), 1000);
        renderRows();
      } catch (e) {
        $('#rows').innerHTML = `<tr><td colspan="9" class="empty">${esc(e.message)}</td></tr>`;
      }
    }

    const sorters = {
      earned:   (a, b) => b.total_earned - a.total_earned,
      balance:  (a, b) => b.balance - a.balance,
      aircraft: (a, b) => b.aircraft_count - a.aircraft_count,
      created:  (a, b) => new Date(b.created_at) - new Date(a.created_at),
      nickname: (a, b) => (a.nickname || '~').localeCompare(b.nickname || '~', 'pt-BR'),
    };

    function renderRows() {
      const list = [...players].sort(sorters[$('#sort').value]);
      const total = players[0]?.total_count ?? 0;
      $('#count').textContent = `${list.length} de ${total} jogadores`;

      if (!list.length) {
        $('#rows').innerHTML = '<tr><td colspan="9" class="empty">Nenhum jogador encontrado.</td></tr>';
        return;
      }
      $('#rows').innerHTML = list.map((p, i) => `
        <tr data-id="${p.user_id}" class="${p.user_id === selectedId ? 'selected' : ''}">
          <td class="rank">${i + 1}</td>
          <td><strong class="mono">${p.nickname ? esc(p.nickname) : '<span class="muted">(sem nickname)</span>'}</strong>
              ${p.role === 'admin' ? ' <span class="badge info">admin</span>' : ''}</td>
          <td class="muted">${esc(p.email)}</td>
          <td class="num">${fmtPoints(p.total_earned)}</td>
          <td class="num">${fmtPoints(p.balance)}</td>
          <td class="num">${p.aircraft_count}</td>
          <td>${p.dcs_linked ? '<span class="badge ok">vinculado</span>' : '<span class="badge">—</span>'}</td>
          <td>${p.status === 'banned' ? '<span class="badge danger">suspenso</span>' : '<span class="badge ok">ativo</span>'}</td>
          <td class="muted mono" style="font-size:12px">${fmtDate(p.created_at)}</td>
        </tr>`).join('');
    }

    let searchTimer;
    $('#search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadPlayers, 300); });
    $('#sort').addEventListener('change', renderRows);
    $('#rows').addEventListener('click', (e) => {
      const tr = e.target.closest('tr[data-id]');
      if (tr) openPlayer(tr.dataset.id);
    });

    // ---------------- Detalhe ----------------
    async function openPlayer(id) {
      selectedId = id;
      renderRows();
      const box = $('#detail');
      box.innerHTML = '<div class="loading">CARREGANDO…</div>';
      let d;
      try { d = await admin.playerDetail(id); }
      catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

      const { profile: p, balance, owned, ledger, catalog } = d;
      const ownedIds = new Set(owned.map((o) => o.aircraft_id));
      const nameOf = Object.fromEntries(catalog.map((a) => [a.id, a.name]));
      const notOwned = catalog.filter((a) => !ownedIds.has(a.id));
      const banned = p.status === 'banned';
      const isMe = p.id === me.id;

      box.innerHTML = `
        <div class="detail-head">
          <span class="label">Jogador</span>
          <h2 class="mono" style="margin-top:6px">${p.nickname ? esc(p.nickname) : '(sem nickname)'}</h2>
          <div class="who">
            <span class="muted" style="font-size:13px">${esc(p.email)}</span>
            ${p.role === 'admin' ? '<span class="badge info">admin</span>' : ''}
            ${banned ? '<span class="badge danger">suspenso</span>' : '<span class="badge ok">ativo</span>'}
          </div>
          <div class="balance-big">${fmtPoints(balance)} <span class="label">pts</span></div>
        </div>

        <form class="section" id="points-form">
          <span class="label">Lançar pontos</span>
          <div class="inline-form">
            <input class="input" name="amount" type="number" step="1" placeholder="+100" required aria-label="Pontos">
            <input class="input" name="reason" placeholder="Motivo (ex.: Missão Red Flag 12/10)" required aria-label="Motivo">
            <button class="btn">Lançar</button>
          </div>
          <span class="hint">Use número negativo para remover pontos.</span>
        </form>

        <div class="section">
          <span class="label">Aeronaves liberadas (${owned.length})</span>
          <ul class="ac-list">
            ${owned.length ? owned.map((o) => `
              <li>
                <span>${esc(nameOf[o.aircraft_id] || o.aircraft_id)}
                  <span class="tag">${o.granted_by ? '· liberada pelo admin' : ''}</span></span>
                <button class="btn danger sm" data-revoke="${esc(o.aircraft_id)}">Revogar</button>
              </li>`).join('') : '<li class="muted">Nenhuma ainda.</li>'}
          </ul>
          ${owned.length ? '<label class="check"><input type="checkbox" id="refund"> Devolver os pontos ao revogar</label>' : ''}
          ${notOwned.length ? `
            <div class="row-inline">
              <select class="input" id="grant-select" aria-label="Aeronave">
                ${notOwned.map((a) => `<option value="${esc(a.id)}">T${a.tier} · ${esc(a.name)}</option>`).join('')}
              </select>
              <button class="btn ghost sm" id="grant">Liberar grátis</button>
            </div>` : ''}
        </div>

        <div class="section">
          <span class="label">Conta</span>
          ${isMe ? '<span class="muted" style="font-size:14px">Esta é a sua conta.</span>'
            : banned ? '<button class="btn ok" id="status" data-to="active">Reativar jogador</button>'
                     : '<button class="btn danger" id="status" data-to="banned">Suspender jogador</button>'}
        </div>

        <div class="section">
          <span class="label">Histórico de pontos</span>
          <ul class="ledger">
            ${ledger.length ? ledger.map((l) => `
              <li>
                <span class="when">${fmtDate(l.created_at)}</span>
                <span>${esc(l.reason)} <span class="tag muted" style="font-size:11px">· ${l.source}</span></span>
                <span class="amt ${l.amount > 0 ? 'pos' : 'neg'}">${l.amount > 0 ? '+' : ''}${fmtPoints(l.amount)}</span>
              </li>`).join('') : '<li class="muted" style="display:block">Nenhum lançamento.</li>'}
          </ul>
        </div>`;

      // Ações
      $('#points-form', box).addEventListener('submit', (e) => {
        e.preventDefault();
        const f = e.target;
        const amount = parseInt(f.amount.value, 10);
        if (!amount) return toast('Informe uma quantidade diferente de zero.', 'err');
        act(() => admin.addPoints(p.id, amount, f.reason.value.trim()),
            `${amount > 0 ? '+' : ''}${fmtPoints(amount)} pts para ${p.nickname || p.email}`);
      });

      box.querySelectorAll('[data-revoke]').forEach((b) => b.addEventListener('click', () => {
        const id = b.dataset.revoke;
        const refund = $('#refund', box)?.checked ?? false;
        if (!confirm(`Revogar ${nameOf[id] || id}${refund ? ' e devolver os pontos' : ''}?`)) return;
        act(() => admin.revokeAircraft(p.id, id, refund), 'Aeronave revogada.');
      }));

      $('#grant', box)?.addEventListener('click', () => {
        const id = $('#grant-select', box).value;
        act(() => admin.grantAircraft(p.id, id), `${nameOf[id]} liberada.`);
      });

      $('#status', box)?.addEventListener('click', (e) => {
        const to = e.target.dataset.to;
        if (to === 'banned' && !confirm(`Suspender ${p.nickname || p.email}? Ele perde o acesso ao site.`)) return;
        act(() => admin.setStatus(p.id, to), to === 'banned' ? 'Jogador suspenso.' : 'Jogador reativado.');
      });
    }

    async function act(fn, okMsg) {
      try {
        await fn();
        toast(okMsg);
        await Promise.all([loadPlayers(), openPlayer(selectedId), refreshBalance()]);
      } catch (e) { toast(e.message, 'err'); }
    }

    // ---------------- Exportar ----------------
    $('#export').addEventListener('click', () => {
      const cols = ['nickname', 'email', 'total_earned', 'balance', 'aircraft_count', 'dcs_linked', 'status', 'role', 'created_at'];
      const cell = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const csv = [cols.join(';'), ...players.map((p) => cols.map((c) => cell(p[c])).join(';'))].join('\r\n');
      const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
      const a = Object.assign(document.createElement('a'), { href: url, download: `jogadores-${new Date().toISOString().slice(0, 10)}.csv` });
      a.click();
      URL.revokeObjectURL(url);
    });

    // ---------------- Início ----------------
    if (me) {
      renderTopbar(me, 'admin');
      await loadPlayers();
    }
  </script>
</body>
</html>
